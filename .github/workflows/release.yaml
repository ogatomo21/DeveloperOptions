name: Android Release Build and Publish

on:
  push:
    tags:
      - "v*" # 例: v1.3.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- 署名（Keystore）---
      # GitHub Secrets に KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD が必要
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > app/keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG_NAME=${{ github.ref_name }}
          cd app/build/outputs/apk/release/
          for file in *.apk; do
            # app-release.apk -> developerOptions-v1.3.0.apk
            NEW_NAME=$(echo "$file" | sed "s/app-/developerOptions-${TAG_NAME}-/" | sed "s/-release//")
            mv "$file" "$NEW_NAME"
            echo "Renamed: $file -> $NEW_NAME"
          done
          ls -la

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: developerOptions ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/developerOptions-*.apk
